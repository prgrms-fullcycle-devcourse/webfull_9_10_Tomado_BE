name: ${COMPOSE_PROJECT_NAME:-tomado}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tomado}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tomado}
      POSTGRES_USER: ${POSTGRES_USER:-tomado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tomado_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-tomado}-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: ${COMPOSE_PROJECT_NAME:-tomado}-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    profiles: ['tools']

volumes:
  postgres_data:
  redis_data:
